<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DIPYatzy Template</title>
	<link rel="stylesheet" href="index.css">
    <script type="module" src="gui.js" defer></script>
</head>
<body>
	<main class="layout">
		<div id="left-column" class="column left-column">
			<div id="right-panel" class="panel">
				<h2>Score Area</h2>
				<div class="score-list">
					<p><span>1-s</span><input type="text" value="0"></p>
					<p><span>2-s</span><input type="text" value="0"></p>
					<p><span>3-s</span><input type="text" value="0"></p>
					<p><span>4-s</span><input type="text" value="0"></p>
					<p><span>5-s</span><input type="text" value="0"></p>
					<p><span>6-s</span><input type="text" value="0"></p>
					<p><span>One pair</span><input type="text" value="0"></p>
					<p><span>Two pairs</span><input type="text" value="0"></p>
					<p><span>Three same</span><input type="text" value="0"></p>
					<p><span>Four same</span><input type="text" value="0"></p>
					<p><span>Full house</span><input type="text" value="0"></p>
					<p><span>Small straight</span><input type="text" value="0"></p>
					<p><span>Large straight</span><input type="text" value="0"></p>
					<p><span>Chance</span><input type="text" value="0"></p>
					<p><span>Yatzy</span><input type="text" value="0"></p>
				</div>
			</div>
		</div>

		<div id="right-column" class="column right-column">
			<div id="game-panel" class="panel">
				<h2>Dice</h2>
				<div class="dice-list">
					<img src="images/five.png" alt="DiceOne">
					<img src="images/two.png" alt="DiceTwo">
					<img src="images/one.png" alt="DiceThree">
					<img src="images/four.png" alt="DiceFour">
					<img src="images/six.png" alt="DiceFive">
				</div>
				<button id="roll-button" type="button">Roll dice</button>
			</div>
		</div>
	</main>
</body>
</html>
