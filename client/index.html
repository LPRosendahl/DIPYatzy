<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DIPYatzy Template</title>
	<link rel="stylesheet" href="index.css">
    <script type="module" src="gui.js" defer></script>
</head>
<body>
	<main class="layout">
		<div id="left-column" class="column left-column">
			<div id="right-panel" class="panel">
				<h2>Score Area</h2>
				<div class="score-list">
					<p>1-s<input type="button" value="0"></p>
					<p>2-s<input type="button" value="0"></p>
					<p>3-s<input type="button" value="0"></p>
					<p>4-s<input type="button" value="0"></p>
					<p>5-s<input type="button" value="0"></p>
					<p>6-s<input type="button" value="0"></p>
					<p>One pair<input type="button" value="0"></p>
					<p>Two pairs<input type="button" value="0"></p>
					<p>Three same<input type="button" value="0"></p>
					<p>Four same<input type="button" value="0"></p>
					<p>Full house<input type="button" value="0"></p>
					<p>Small straight<input type="button" value="0"></p>
					<p>Large straight<input type="button" value="0"></p>
					<p>Chance<input type="button" value="0"></p>
					<p>Yatzy<input type="button" value="0"></p>
				</div>
			</div>
		</div>

		<div id="right-column" class="column right-column">
			<div id="game-panel" class="panel">
				<h2>Dice</h2>
				<div class="dice-list">
					<img src="images/five.png" alt="DiceOne">
					<img src="images/two.png" alt="DiceTwo">
					<img src="images/one.png" alt="DiceThree">
					<img src="images/four.png" alt="DiceFour">
					<img src="images/six.png" alt="DiceFive">
				</div>
				<button id="roll-button" type="button">Roll dice</button>
			</div>
		</div>
	</main>
</body>
</html>
