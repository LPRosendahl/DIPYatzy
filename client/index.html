<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DIPYatzy Template</title>
	<link rel="stylesheet" href="index.css">
    <script type="module" src="gui.js" defer></script>
</head>
<body>
	<main class="layout">
		<div id="left-column" class="column left-column">
			<div id="right-panel" class="panel">
				<h2>Score Area</h2>
				<div class="score-list">
					<p>1-s<input type="button" value="0"></p>
					<p>2-s<input type="button" value="0"></p>
					<p>3-s<input type="button" value="0"></p>
					<p>4-s<input type="button" value="0"></p>
					<p>5-s<input type="button" value="0"></p>
					<p>6-s<input type="button" value="60"></p>
					<p class="sum-row">Total: <output id="upperSum"></output></p>
					<p>Bonus: <output id="bonus"></output></p>
					<p>One pair<input type="button" value="0"></p>
					<p>Two pairs<input type="button" value="0"></p>
					<p>Three of a kind<input type="button" value="0"></p>
					<p>Four of a kind<input type="button" value="0"></p>
					<p>Small straight<input type="button" value="0"></p>
					<p>Large straight<input type="button" value="0"></p>
					<p>Full house<input type="button" value="0"></p>
					<p>Chance<input type="button" value="0"></p>
					<p>Yatzy<input type="button" value="0"></p><br>
					<p class="sum-row">Total: <output id="sum"></output></p>
				</div>
			</div>
		</div>

		<div id="right-column" class="column right-column">
			<div id="game-panel" class="panel">
				<h2>Dice</h2>
				<div class="dice-list">
					<button><img src="images/five.png" alt="DiceOne"></button>
					<button><img src="images/two.png" alt="DiceTwo"></button>
					<button><img src="images/three.png" alt="DiceThree"></button>
					<button><img src="images/four.png" alt="DiceFour"></button>
					<button><img src="images/six.png" alt="DiceFive"></button>
				</div>
				<p>Roll count: <input type="text" readonly id="rollCounter" value="3"></p>
				<button id="roll-button" type="button">Roll dice</button>
			</div>
		</div>
	</main>
</body>
</html>
